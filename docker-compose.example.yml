# 复制此文件为 docker-compose.yml 并修改媒体路径
# docker-compose.yml 不会被提交到 Git

services:
  qanvidnas:
    build: .
    container_name: qanvidnas
    restart: unless-stopped
    ports:
      - "6666:6666"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - /your/nas/media/path:/media    # ← 改成你的 NAS 媒体文件夹路径
    environment:
      - TZ=Asia/Shanghai
